[project]
name = "mihealth"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"
